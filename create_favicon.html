<!DOCTYPE html>
<html>
<head>
    <title>Create Favicon</title>
</head>
<body>
    <canvas id="canvas" width="32" height="32" style="border: 1px solid #000;"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Dark red background
        ctx.fillStyle = '#1a0000';
        ctx.fillRect(0, 0, 32, 32);
        
        // White bottle outline
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        
        // Bottle body
        ctx.strokeRect(10, 10, 12, 14);
        // Bottle neck
        ctx.strokeRect(12, 7, 8, 4);
        // Bottle cap
        ctx.fillStyle = '#888888';
        ctx.fillRect(13, 5, 6, 3);
        
        // Red cross
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(12, 14, 8, 2);
        ctx.fillRect(15, 11, 2, 8);
        
        // Download
        canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'favicon.png';
            a.click();
        });
    </script>
</body>
</html>
