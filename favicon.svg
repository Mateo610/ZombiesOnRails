<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#bg)" rx="10"/>
  
  <!-- Red cross (medical symbol) -->
  <rect x="35" y="20" width="30" height="8" rx="4" fill="#ff0000"/>
  <rect x="46" y="9" width="8" height="30" rx="4" fill="#ff0000"/>
  
  <!-- Bottle outline -->
  <path d="M 30 50 L 30 75 Q 30 80 35 80 L 65 80 Q 70 80 70 75 L 70 50 Q 70 45 65 45 L 60 45 L 60 40 Q 60 35 55 35 L 45 35 Q 40 35 40 40 L 40 45 L 35 45 Q 30 45 30 50 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Bottle cap -->
  <rect x="42" y="32" width="16" height="6" rx="2" fill="#888888"/>
