<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Rail Shooter - Title Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #title-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        
        #game-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 5rem;
            color: #ff4422;
            text-shadow: 
                0 0 20px rgba(255, 68, 34, 0.8),
                0 0 40px rgba(255, 68, 34, 0.5),
                4px 4px 0 #000;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            animation: titlePulse 3s ease-in-out infinite;
        }
        
        #subtitle {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            color: #aaa;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        
        #start-prompt {
            position: absolute;
            bottom: 15%;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.2em;
            animation: blink 1.5s ease-in-out infinite;
            pointer-events: auto;
            cursor: pointer;
        }
        
        @keyframes titlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="title-overlay">
            <h1 id="game-title">Dead Zone</h1>
            <p id="subtitle">Extraction Protocol</p>
            <p id="start-prompt">[ CLICK TO BEGIN ]</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================
        // SCENE SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 30);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8;
        document.getElementById('game-container').prepend(renderer.domElement);

        // ============================================
        // LIGHTING
        // ============================================
        // Dim ambient for base visibility
        const ambient = new THREE.AmbientLight(0x1a1a2e, 0.3);
        scene.add(ambient);

        // Cold moonlight from above/behind
        const moonLight = new THREE.DirectionalLight(0x4466aa, 0.4);
        moonLight.position.set(-20, 30, -10);
        scene.add(moonLight);

        // Warm fire glow from below/side (simulating distant fires)
        const fireGlow = new THREE.PointLight(0xff6622, 1.5, 100);
        fireGlow.position.set(-30, 2, -20);
        scene.add(fireGlow);

        const fireGlow2 = new THREE.PointLight(0xff4411, 1, 80);
        fireGlow2.position.set(25, 1, -30);
        scene.add(fireGlow2);

        // ============================================
        // GROUND
        // ============================================
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        scene.add(ground);

        // ============================================
        // FACTORY BUILDINGS (Silhouettes)
        // ============================================
        const buildingMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a0f,
            roughness: 0.95,
            metalness: 0
        });

        function createBuilding(width, height, depth, x, z) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mesh = new THREE.Mesh(geo, buildingMat);
            mesh.position.set(x, height / 2, z);
            scene.add(mesh);
            return mesh;
        }

        function createSmokestack(radius, height, x, z) {
            const geo = new THREE.CylinderGeometry(radius * 0.7, radius, height, 8);
            const mesh = new THREE.Mesh(geo, buildingMat);
            mesh.position.set(x, height / 2, z);
            scene.add(mesh);
            return mesh;
        }

        // Main factory complex - left side
        createBuilding(25, 18, 15, -30, -25);
        createBuilding(15, 12, 20, -15, -30);
        createBuilding(10, 25, 10, -35, -35);
        createSmokestack(2, 35, -40, -30);
        createSmokestack(1.5, 28, -25, -40);

        // Right side buildings
        createBuilding(20, 15, 18, 25, -28);
        createBuilding(12, 22, 12, 35, -35);
        createBuilding(18, 10, 25, 15, -40);
        createSmokestack(2.5, 40, 40, -25);

        // Background buildings (more distant, larger)
        createBuilding(40, 30, 20, 0, -60);
        createBuilding(30, 35, 15, -40, -70);
        createBuilding(35, 25, 18, 45, -65);
        createSmokestack(3, 50, -55, -60);
        createSmokestack(3, 45, 55, -55);

        // ============================================
        // WINDOW LIGHTS (Flickering)
        // ============================================
        const windowLights = [];
        const windowMat = new THREE.MeshBasicMaterial({ color: 0xffaa44 });

        function createWindow(x, y, z, size = 1) {
            const geo = new THREE.PlaneGeometry(size * 1.5, size * 2);
            const mesh = new THREE.Mesh(geo, windowMat.clone());
            mesh.position.set(x, y, z);
            mesh.userData.baseIntensity = 0.3 + Math.random() * 0.7;
            mesh.userData.flickerSpeed = 1 + Math.random() * 3;
            mesh.userData.flickerOffset = Math.random() * Math.PI * 2;
            windowLights.push(mesh);
            scene.add(mesh);
            return mesh;
        }

        // Scatter some windows on buildings
        createWindow(-30, 8, -17.5, 1.2);
        createWindow(-27, 12, -17.5, 1);
        createWindow(-33, 6, -17.5, 0.8);
        createWindow(25, 7, -19, 1.1);
        createWindow(28, 11, -19, 0.9);
        createWindow(0, 15, -50, 1.5);
        createWindow(-5, 20, -50, 1.3);
        createWindow(8, 12, -50, 1.4);
        createWindow(-40, 18, -62, 1.6);
        createWindow(45, 14, -56, 1.2);

        // ============================================
        // EMBER PARTICLES
        // ============================================
        const emberCount = 150;
        const emberGeometry = new THREE.BufferGeometry();
        const emberPositions = new Float32Array(emberCount * 3);
        const emberVelocities = [];
        const emberSizes = new Float32Array(emberCount);

        for (let i = 0; i < emberCount; i++) {
            emberPositions[i * 3] = (Math.random() - 0.5) * 100;
            emberPositions[i * 3 + 1] = Math.random() * 30;
            emberPositions[i * 3 + 2] = -20 + (Math.random() - 0.5) * 60;
            
            emberVelocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: 0.02 + Math.random() * 0.03,
                z: (Math.random() - 0.5) * 0.01
            });
            
            emberSizes[i] = 2 + Math.random() * 3;
        }

        emberGeometry.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
        emberGeometry.setAttribute('size', new THREE.BufferAttribute(emberSizes, 1));

        const emberMaterial = new THREE.PointsMaterial({
            color: 0xff6633,
            size: 0.3,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });

        const embers = new THREE.Points(emberGeometry, emberMaterial);
        scene.add(embers);

        // ============================================
        // FOG LAYERS
        // ============================================
        const fogLayers = [];
        const fogTexture = createFogTexture();

        function createFogTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 256);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createFogLayer(y, z, scale, speed) {
            const geo = new THREE.PlaneGeometry(120, 20);
            const mat = new THREE.MeshBasicMaterial({
                map: fogTexture,
                transparent: true,
                opacity: 0.15,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, y, z);
            mesh.scale.set(scale, scale, 1);
            mesh.userData.speed = speed;
            mesh.userData.startX = -80;
            fogLayers.push(mesh);
            scene.add(mesh);
            return mesh;
        }

        createFogLayer(3, -15, 1.5, 0.8);
        createFogLayer(5, -25, 2, 0.5);
        createFogLayer(2, -10, 1, 1.2);
        createFogLayer(8, -35, 2.5, 0.3);

        // ============================================
        // ZOMBIE SILHOUETTES
        // ============================================
        const zombies = [];
        const zombieMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000,
            transparent: true,
            opacity: 0.9
        });

        function createZombieSilhouette(x, z) {
            const group = new THREE.Group();
            
            // Simple body shape
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.8, 0.4);
            const body = new THREE.Mesh(bodyGeo, zombieMat);
            body.position.y = 1.2;
            group.add(body);
            
            // Head
            const headGeo = new THREE.SphereGeometry(0.35, 8, 6);
            const head = new THREE.Mesh(headGeo, zombieMat);
            head.position.y = 2.4;
            group.add(head);
            
            // Arms (slightly outstretched for zombie pose)
            const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
            const leftArm = new THREE.Mesh(armGeo, zombieMat);
            leftArm.position.set(-0.6, 1.4, 0.3);
            leftArm.rotation.x = -0.5;
            leftArm.rotation.z = 0.3;
            group.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeo, zombieMat);
            rightArm.position.set(0.6, 1.5, 0.4);
            rightArm.rotation.x = -0.7;
            rightArm.rotation.z = -0.2;
            group.add(rightArm);
            
            group.position.set(x, 0, z);
            group.userData.startX = x;
            group.userData.swayOffset = Math.random() * Math.PI * 2;
            group.userData.swaySpeed = 0.5 + Math.random() * 0.5;
            group.userData.walkSpeed = 0.005 + Math.random() * 0.01;
            group.userData.walkDirection = Math.random() > 0.5 ? 1 : -1;
            
            zombies.push(group);
            scene.add(group);
            return group;
        }

        // Place zombies in mid-ground
        createZombieSilhouette(-15, -18);
        createZombieSilhouette(-8, -22);
        createZombieSilhouette(10, -20);
        createZombieSilhouette(18, -25);
        createZombieSilhouette(-25, -28);

        // ============================================
        // HELICOPTER LIGHT IN DISTANCE
        // ============================================
        const heliLight = new THREE.PointLight(0xffffff, 2, 50);
        heliLight.position.set(40, 25, -80);
        scene.add(heliLight);

        const heliGlow = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        heliGlow.position.copy(heliLight.position);
        scene.add(heliGlow);

        // ============================================
        // ANIMATION LOOP
        // ============================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Subtle camera drift
            camera.position.x = Math.sin(elapsed * 0.1) * 2;
            camera.position.y = 8 + Math.sin(elapsed * 0.15) * 0.5;
            camera.lookAt(0, 5, -20);

            // Flicker window lights
            windowLights.forEach(window => {
                const flicker = Math.sin(elapsed * window.userData.flickerSpeed + window.userData.flickerOffset);
                const noise = Math.random() * 0.2;
                const intensity = window.userData.baseIntensity * (0.5 + flicker * 0.3 + noise);
                window.material.opacity = Math.max(0.1, Math.min(1, intensity));
            });

            // Animate embers
            const positions = emberGeometry.attributes.position.array;
            for (let i = 0; i < emberCount; i++) {
                positions[i * 3] += emberVelocities[i].x;
                positions[i * 3 + 1] += emberVelocities[i].y;
                positions[i * 3 + 2] += emberVelocities[i].z;
                
                // Add some wavering
                positions[i * 3] += Math.sin(elapsed * 2 + i) * 0.005;
                
                // Reset if too high
                if (positions[i * 3 + 1] > 35) {
                    positions[i * 3] = (Math.random() - 0.5) * 100;
                    positions[i * 3 + 1] = 0;
                    positions[i * 3 + 2] = -20 + (Math.random() - 0.5) * 60;
                }
            }
            emberGeometry.attributes.position.needsUpdate = true;

            // Animate fog layers
            fogLayers.forEach(fog => {
                fog.position.x += fog.userData.speed * 0.05;
                if (fog.position.x > 80) {
                    fog.position.x = -80;
                }
            });

            // Animate zombie shuffling
            zombies.forEach(zombie => {
                // Swaying motion
                zombie.rotation.z = Math.sin(elapsed * zombie.userData.swaySpeed + zombie.userData.swayOffset) * 0.1;
                zombie.rotation.x = Math.sin(elapsed * zombie.userData.swaySpeed * 0.7 + zombie.userData.swayOffset) * 0.05;
                
                // Slow shuffle walk
                zombie.position.x += zombie.userData.walkSpeed * zombie.userData.walkDirection;
                
                // Reverse direction occasionally
                if (Math.abs(zombie.position.x - zombie.userData.startX) > 5) {
                    zombie.userData.walkDirection *= -1;
                }
            });

            // Helicopter light subtle movement
            heliLight.position.x = 40 + Math.sin(elapsed * 0.3) * 5;
            heliLight.position.y = 25 + Math.sin(elapsed * 0.5) * 2;
            heliGlow.position.copy(heliLight.position);
            
            // Flicker helicopter light
            heliLight.intensity = 2 + Math.sin(elapsed * 8) * 0.3;

            // Fire glow flickering
            fireGlow.intensity = 1.5 + Math.sin(elapsed * 3) * 0.3 + Math.random() * 0.2;
            fireGlow2.intensity = 1 + Math.sin(elapsed * 2.5 + 1) * 0.2 + Math.random() * 0.15;

            renderer.render(scene, camera);
        }

        animate();

        // ============================================
        // WINDOW RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // START GAME INTERACTION
        // ============================================
        document.getElementById('start-prompt').addEventListener('click', () => {
            console.log('Starting game...');
            // Fade out and transition to game
            document.getElementById('title-overlay').style.transition = 'opacity 1s';
            document.getElementById('title-overlay').style.opacity = '0';
            
            // Here you would transition to your game scene
            setTimeout(() => {
                alert('Game would start here!');
            }, 1000);
        });
    </script>
</body>
</html>
