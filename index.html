<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Rail Shooter</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease-in;
        }

        canvas.visible {
            opacity: 1;
        }
        
        /* Arcade-style crosshair */
        #crosshair {
            position: fixed;
            top: 0;
            left: 0;
            /* Position will be set dynamically via transform */
            /* Initial position will be set by CrosshairManager to center */
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 100;
            transform-origin: center center;
        }
        
        .crosshair-line {
            position: absolute;
            background: #ff1493; /* Hot pink */
            box-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 30px #ff1493;
        }
        
        .crosshair-line.horizontal {
            width: 30px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .crosshair-line.vertical {
            width: 2px;
            height: 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .crosshair-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff; /* Cyan */
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 15px #00ffff;
        }
        
        /* Enhanced Muzzle flash effect */
        #muzzle-flash {
            transition: opacity 0.05s ease-out, transform 0.05s ease-out;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 200, 0.8) 0%, rgba(255, 200, 100, 0.6) 50%, transparent 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s ease-out;
            z-index: 50;
        }

        /* Loading screen overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }

        #loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #loading-text {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 4px 4px 8px #000;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Start Screen Menu */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(20, 0, 40, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: 'Courier New', monospace;
            transition: opacity 0.5s ease-out;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-screen-title {
            font-size: 96px;
            color: #ffff00;
            text-shadow: 
                0 0 20px #ffff00,
                0 0 40px #ffff00,
                0 0 60px #ffff00,
                4px 4px 8px #000;
            margin-bottom: 60px;
            letter-spacing: 8px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 
                    0 0 20px #ffff00,
                    0 0 40px #ffff00,
                    0 0 60px #ffff00,
                    4px 4px 8px #000;
            }
            50% { 
                text-shadow: 
                    0 0 30px #ffff00,
                    0 0 60px #ffff00,
                    0 0 90px #ffff00,
                    4px 4px 8px #000;
            }
        }

        #start-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #play-button {
            padding: 20px 60px;
            font-size: 32px;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #00ff00;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 0 0 10px #00ff00;
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.5),
                inset 0 0 20px rgba(0, 255, 0, 0.1);
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        #play-button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 
                0 0 30px rgba(0, 255, 0, 0.8),
                inset 0 0 30px rgba(0, 255, 0, 0.2);
            transform: scale(1.05);
        }

        #play-button:active {
            transform: scale(0.95);
        }

        #difficulty-selector {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        #difficulty-selector.visible {
            display: flex;
        }

        #difficulty-label {
            font-size: 20px;
            color: #999999;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #difficulty-buttons {
            display: flex;
            gap: 15px;
        }

        .difficulty-button {
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            color: #999999;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #666666;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .difficulty-button:hover {
            color: #ffffff;
            border-color: #999999;
            background: rgba(255, 255, 255, 0.1);
        }

        .difficulty-button.selected {
            color: #00ccff;
            border-color: #00ccff;
            background: rgba(0, 204, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
            text-shadow: 0 0 10px #00ccff;
        }

        #confirm-button {
            padding: 15px 50px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            color: #ffff00;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #ffff00;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 0 0 10px #ffff00;
            box-shadow: 
                0 0 20px rgba(255, 255, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 0, 0.1);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            display: none;
            margin-top: 20px;
        }

        #confirm-button.visible {
            display: block;
        }

        #confirm-button:hover {
            background: rgba(255, 255, 0, 0.2);
            box-shadow: 
                0 0 30px rgba(255, 255, 0, 0.8),
                inset 0 0 30px rgba(255, 255, 0, 0.2);
            transform: scale(1.05);
        }

        #confirm-button:active {
            transform: scale(0.95);
        }

        /* Fade transition overlay */
        #fade-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 5000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
        }

        #fade-transition.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div id="loading-text">LOADING...</div>
    </div>
    <div id="fade-transition"></div>
    <div id="start-screen">
        <div id="start-screen-title">TEST</div>
        <div id="start-menu">
            <button id="play-button">PLAY</button>
            <div id="difficulty-selector">
                <div id="difficulty-label">DIFFICULTY</div>
                <div id="difficulty-buttons">
                    <button class="difficulty-button" data-difficulty="easy">EASY</button>
                    <button class="difficulty-button selected" data-difficulty="medium">MEDIUM</button>
                    <button class="difficulty-button" data-difficulty="hard">HARD</button>
                </div>
                <button id="confirm-button">CONFIRM</button>
            </div>
        </div>
    </div>
    <div id="muzzle-flash"></div>
    <div id="crosshair">
        <div class="crosshair-line horizontal"></div>
        <div class="crosshair-line vertical"></div>
        <div class="crosshair-dot"></div>
    </div>
    <!-- <script type="module" src="/src/mainorbit.js"></script> -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
